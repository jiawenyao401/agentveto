[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentveto"
version = "0.1.0"
description = "Runtime control for AI agents - replay any run, prove what happened, veto what must not happen."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["agent", "llm", "observability", "tracing", "audit", "replay", "agentops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debugging",
]
# Zero required dependencies on purpose. sqlite3 is stdlib.
dependencies = []

[project.optional-dependencies]
serve = ["fastapi>=0.100", "uvicorn>=0.20"]
dev = ["pytest>=7.0", "fastapi>=0.100", "uvicorn>=0.20", "httpx>=0.24", "openai>=1.0"]

[project.scripts]
agentveto = "agentveto.cli:main"

[tool.setuptools.packages.find]
include = ["agentveto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
