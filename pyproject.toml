[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentveto"
version = "0.1.0"
description = "Runtime control for AI agents - replay any run, prove what happened, veto what must not happen."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["agent", "llm", "observability", "tracing", "audit", "replay", "agentops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debugging",
]
# Zero required dependencies on purpose. sqlite3 is stdlib.
dependencies = []

[project.optional-dependencies]
serve = ["fastapi>=0.100", "uvicorn>=0.20"]
mcp = ["mcp>=1.0,<2"]
# Ed25519 signing for the Prove layer. The integrity chain (hash chain + verify)
# works with zero deps; this extra only adds asymmetric, third-party verification.
sign = ["cryptography>=41"]
dev = ["pytest>=7.0", "fastapi>=0.100", "uvicorn>=0.20", "httpx>=0.24", "openai>=1.0", "mcp>=1.0,<2", "cryptography>=41"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.0"]

[project.scripts]
agentveto = "agentveto.cli:main"
agentveto-mcp = "agentveto.mcp:main"

[tool.setuptools.packages.find]
include = ["agentveto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
# Be conservative during the early-alpha stage. The CI lint job runs
# ruff, but only fails on rules we'd actually want to keep clean.
select = ["E", "F"]
ignore = ["F841"]  # unused local var: often intentional in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # imports are part of the contract being tested
"agentveto/report.py" = ["E501", "E701"]  # inline HTML/CSS/JS; left long on purpose
"agentveto/serve.py" = ["E501", "E701"]
"agentveto/tracer.py" = ["E501"]