name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true

jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
      contents: write # create the GitHub Release; without this it 403s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Never ship a tag that couldn't pass its own tests. Installing the
      # extras here also proves the optional imports resolve.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install ".[dev]"

      - name: Test
        run: pytest -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
